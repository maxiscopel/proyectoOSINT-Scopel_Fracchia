services:
  osint-postgres:
    image: postgres:alpine3.22
    container_name: osint-postgres
    restart: always
    environment:
      POSTGRES_USER: osint_user
      POSTGRES_PASSWORD: osint_pass
      POSTGRES_DB: osint_db
    ports:
      - "5432:5432"
    volumes:
      - osint_pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint_user -d osint_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osint-net

  maxi-n8n:
    build: .
    container_name: maxi-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: "America/Argentina/Buenos_Aires"
      NODES_EXCLUDE: "[]"
      N8N_RESTRICT_FILE_ACCESS_TO: "/tmp"
      # Conservar TODAS las ejecuciones (evidencia para la tesis; default: poda a 7 dias)
      EXECUTIONS_DATA_PRUNE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/data/scripts
    depends_on:
      osint-postgres:
        condition: service_healthy
    networks:
      - osint-net

  metabase:
    image: metabase/metabase:latest
    container_name: osint-metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JAVA_TIMEZONE: "America/Argentina/Buenos_Aires"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      osint-postgres:
        condition: service_healthy
    networks:
      - osint-net

volumes:
  osint_pgdata:
    name: osint_pgdata
  n8n_data:
  metabase_data:

networks:
  osint-net:
